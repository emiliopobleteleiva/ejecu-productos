components:
  schemas:
    ActualizarProductoBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ActualizarProductoBody.json
          format: uri
          readOnly: true
          type: string
        categoria_ids:
          description: Nuevos identificadores UUID de categorías. Si se envía, debe incluir al menos una.
          examples:
            - - 7c9e6679-7425-40de-944b-e07fc1f90ae7
          items:
            format: uuid
            type: string
          minItems: 1
          type: array
          uniqueItems: true
        costo:
          description: Nuevo costo en pesos chilenos, entero.
          examples:
            - 12990
          format: int64
          minimum: 0
          type: integer
        descripcion:
          description: Nueva descripción libre del producto.
          examples:
            - Café tostado de origen.
          maxLength: 1000
          type: string
        nombre:
          description: Nuevo nombre visible del producto.
          examples:
            - Café molido 1 kg
          maxLength: 200
          minLength: 1
          type: string
        permite_venta:
          description: Nuevo valor del flag de venta.
          examples:
            - true
          type: boolean
        sku:
          description: Nuevo SKU único del producto.
          examples:
            - PROD-001
          maxLength: 64
          minLength: 3
          pattern: ^[A-Z0-9][A-Z0-9_-]{2,63}$
          type: string
      type: object
    CrearProductoBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/CrearProductoBody.json
          format: uri
          readOnly: true
          type: string
        categoria_ids:
          description: Identificadores UUID de las categorías. Debe incluir al menos una.
          examples:
            - - 7c9e6679-7425-40de-944b-e07fc1f90ae7
              - 16fd2706-8baf-433b-82eb-8c7fada847da
          items:
            format: uuid
            type: string
          minItems: 1
          type: array
          uniqueItems: true
        costo:
          description: Costo en pesos chilenos, entero.
          examples:
            - 12990
          format: int64
          minimum: 0
          type: integer
        descripcion:
          description: Descripción libre del producto.
          examples:
            - Café tostado de origen.
          maxLength: 1000
          type: string
        nombre:
          description: Nombre visible del producto.
          examples:
            - Café molido 1 kg
          maxLength: 200
          minLength: 1
          type: string
        permite_venta:
          description: Indica si el producto puede venderse.
          examples:
            - true
          type: boolean
        sku:
          description: SKU único del producto.
          examples:
            - PROD-001
          maxLength: 64
          minLength: 3
          pattern: ^[A-Z0-9][A-Z0-9_-]{2,63}$
          type: string
      required:
        - sku
        - nombre
        - categoria_ids
        - costo
        - permite_venta
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    ErrorModel:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ErrorModel.json
          format: uri
          readOnly: true
          type: string
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          examples:
            - Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          type:
            - array
            - "null"
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          examples:
            - https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          examples:
            - 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          examples:
            - Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          examples:
            - https://example.com/errors/example
          format: uri
          type: string
      type: object
    ListarProductosBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ListarProductosBody.json
          format: uri
          readOnly: true
          type: string
        productos:
          description: Productos que cumplen los filtros.
          items:
            $ref: "#/components/schemas/Producto"
          type: array
        total:
          description: Cantidad total de productos que cumplen los filtros.
          examples:
            - 2
          format: int64
          type: integer
      required:
        - productos
        - total
      type: object
    Producto:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/Producto.json
          format: uri
          readOnly: true
          type: string
        activo:
          description: Indica si el producto está activo.
          examples:
            - true
          readOnly: true
          type: boolean
        actualizado_en:
          description: Fecha de última actualización (timestamptz en Hito 2).
          format: date-time
          readOnly: true
          type: string
        categoria_ids:
          description: Identificadores UUID de las categorías a las que pertenece el producto.
          examples:
            - - 7c9e6679-7425-40de-944b-e07fc1f90ae7
              - 16fd2706-8baf-433b-82eb-8c7fada847da
          items:
            format: uuid
            type: string
          minItems: 1
          type: array
          uniqueItems: true
        costo:
          description: Costo en pesos chilenos, entero.
          examples:
            - 12990
          format: int64
          minimum: 0
          type: integer
        creado_en:
          description: Fecha de creación (timestamptz en Hito 2).
          format: date-time
          readOnly: true
          type: string
        descripcion:
          description: Descripción libre del producto.
          examples:
            - Café tostado de origen.
          maxLength: 1000
          type: string
        id:
          description: Identificador único del producto.
          examples:
            - 3fa85f64-5717-4562-b3fc-2c963f66afa6
          format: uuid
          readOnly: true
          type: string
        nombre:
          description: Nombre visible del producto.
          examples:
            - Café molido 1 kg
          maxLength: 200
          minLength: 1
          type: string
        permite_venta:
          description: Indica si el producto puede venderse.
          examples:
            - true
          type: boolean
        sku:
          description: SKU único del producto.
          examples:
            - PROD-001
          maxLength: 64
          minLength: 3
          pattern: ^[A-Z0-9][A-Z0-9_-]{2,63}$
          type: string
      required:
        - id
        - sku
        - nombre
        - categoria_ids
        - costo
        - permite_venta
        - activo
        - creado_en
        - actualizado_en
      type: object
info:
  description: CRUD de productos con SKU único, categorización múltiple, costo entero en pesos y flag de venta.
  title: Servicio de Productos
  version: dev
openapi: 3.1.0
paths:
  /api/productos:
    get:
      description: Lista los productos activos y permite filtrar por categoría y por disponibilidad de venta.
      operationId: listar-productos
      parameters:
        - description: Filtra por una categoría (UUID). Es solo un filtro, no un campo del producto.
          example: 7c9e6679-7425-40de-944b-e07fc1f90ae7
          explode: false
          in: query
          name: categoria_id
          schema:
            description: Filtra por una categoría (UUID). Es solo un filtro, no un campo del producto.
            examples:
              - 7c9e6679-7425-40de-944b-e07fc1f90ae7
            format: uuid
            type: string
        - description: Filtra por disponibilidad de venta.
          example: true
          explode: false
          in: query
          name: permite_venta
          schema:
            description: Filtra por disponibilidad de venta.
            examples:
              - true
            type: boolean
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListarProductosBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Lista productos
      tags:
        - productos
    post:
      description: Crea un producto con SKU único y al menos una categoría.
      operationId: crear-producto
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CrearProductoBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Producto"
          description: Created
          headers:
            Location:
              schema:
                description: URL del producto creado.
                type: string
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Crea un producto
      tags:
        - productos
  /api/productos/{id}:
    delete:
      description: "Aplica una baja lógica: el producto deja de listarse y de ser accesible por ID."
      operationId: eliminar-producto
      parameters:
        - description: Identificador UUID del producto.
          in: path
          name: id
          required: true
          schema:
            description: Identificador UUID del producto.
            format: uuid
            type: string
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Desactiva un producto
      tags:
        - productos
    get:
      description: Devuelve un producto activo por su UUID.
      operationId: obtener-producto
      parameters:
        - description: Identificador UUID del producto.
          in: path
          name: id
          required: true
          schema:
            description: Identificador UUID del producto.
            format: uuid
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Producto"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Obtiene un producto por su identificador
      tags:
        - productos
    patch:
      description: Actualiza solo los campos enviados del producto.
      operationId: actualizar-producto
      parameters:
        - description: Identificador UUID del producto.
          in: path
          name: id
          required: true
          schema:
            description: Identificador UUID del producto.
            format: uuid
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActualizarProductoBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Producto"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Actualiza parcialmente un producto
      tags:
        - productos
