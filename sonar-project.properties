sonar.projectKey=emiliopobleteleiva_ejecu-productos
sonar.organization=emiliopobleteleiva
sonar.projectName=ejecu-productos
sonar.sources=apps/api,apps/web
sonar.sourceEncoding=UTF-8
sonar.go.coverage.reportPaths=coverage.out
sonar.javascript.lcov.reportPaths=apps/web/coverage/lcov.info
# Los tests del front viven junto al código; Sonar los indexa como tests y no
# como código propio.
sonar.test.inclusions=apps/web/src/**/*.test.ts,apps/web/src/**/*.test.tsx
sonar.exclusions=apps/api/internal/repository/**,apps/api/cmd/api/main.go,apps/api/cmd/codegen/main.go,apps/web/public/**,apps/web/src/api/contrato.d.ts
# cmd/* son wiring; lo generado (contrato.d.ts, mockServiceWorker.js) no se mide.
sonar.coverage.exclusions=apps/api/cmd/api/main.go,apps/api/cmd/codegen/main.go,apps/api/internal/api/productos_test.go,apps/web/src/api/**,apps/web/src/main.tsx,apps/web/src/mocks/navegador.ts,apps/web/src/**/*.test.ts,apps/web/src/**/*.test.tsx
